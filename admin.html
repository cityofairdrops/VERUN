<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VERUN Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 12px;
    }

    .verification-card {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .status {
      font-weight: bold;
      margin: 8px 0;
    }

    button {
      padding: 10px 16px;
      margin-right: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .approve-button {
      background: #22c55e;
      color: white;
    }

    .reject-button {
      background: #ef4444;
      color: white;
    }

    .unlock-panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      max-width: 480px;
    }

    .unlock-panel input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
    }

    .unlock-panel .lookup-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .unlock-panel .lookup-row input {
      margin-bottom: 0;
    }

    .lookup-button {
      background: #3b82f6;
      color: white;
      white-space: nowrap;
    }

    .lookup-match {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .lookup-match.not-found {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .unlock-button {
      background: #f59e0b;
      color: white;
    }

    .unlock-button:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    .unlock-result {
      margin-top: 10px;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h1>VERUN Verification Panel</h1>

<div id="message">Loading...</div>

<div id="verification-list"></div>

<h2>Unlock Wallet (admin only)</h2>

<div class="unlock-panel">
  <p>
    Permanently clears a user's locked wallet (set after their
    Genesis Pass mint), so they can re-verify with a different
    wallet. This action is logged.
  </p>

  <div class="lookup-row">
    <input
      id="unlock-username"
      type="text"
      placeholder="X username (with or without @)"
    >
    <button
      class="lookup-button"
      onclick="lookupUser()"
    >
      Look up
    </button>
  </div>

  <div id="lookup-match"></div>

  <input
    id="unlock-user-id"
    type="text"
    placeholder="User ID (uuid) — filled in automatically, or paste one directly"
  >

  <button
    id="unlock-button"
    class="unlock-button"
    onclick="unlockWallet()"
  >
    Unlock Wallet
  </button>

  <div id="unlock-result" class="unlock-result"></div>
</div>

<script>

const SUPABASE_URL = "https://lhfgozlkeotxyzqowijz.supabase.co/";
const SUPABASE_ANON_KEY = "sb_publishable_z8j_xh_NIZQHkFck_WqsuA_-zaPAMd0";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


async function checkAdmin() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    document.getElementById("message").textContent =
      "Please log in first.";

    return false;
  }

  const { data, error } =
    await supabaseClient.rpc("is_admin");

  if (error || !data) {

    document.getElementById("message").textContent =
      "Access denied.";

    return false;
  }

  return true;
}


async function loadVerifications() {

  const allowed = await checkAdmin();

  if (!allowed) return;

  const { data, error } =
    await supabaseClient
      .from("task_verifications")
      .select(`
        id,
        user_id,
        task_id,
        status,
        started_at,
        created_at,
        tasks (
          title,
          description,
          xp_reward,
          target_url
        )
      `)
      .eq("status", "pending")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    document.getElementById("message").textContent =
      "Unable to load verification requests.";

    return;
  }

  const list =
    document.getElementById("verification-list");

  list.innerHTML = "";

  if (!data || data.length === 0) {

    document.getElementById("message").textContent =
      "No pending verifications.";

    return;
  }

  document.getElementById("message").textContent =
    `${data.length} pending verification(s)`;

  data.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "verification-card";

    card.innerHTML = `

      <h3>
        ${escapeHtml(item.tasks?.title || "Task")}
      </h3>

      <p>
        ${escapeHtml(
          item.tasks?.description || ""
        )}
      </p>

      <p>
        <strong>Reward:</strong>
        ${item.tasks?.xp_reward || 0} XP
      </p>

      <p>
        <strong>User ID:</strong>
        ${escapeHtml(item.user_id)}
      </p>

      <p>
        <strong>Started:</strong>
        ${new Date(
          item.started_at
        ).toLocaleString()}
      </p>

      <button
        class="approve-button"
        onclick="approveVerification('${item.id}')"
      >
        Approve
      </button>

      <button
        class="reject-button"
        onclick="rejectVerification('${item.id}')"
      >
        Reject
      </button>
    `;

    list.appendChild(card);

  });
}


async function approveVerification(id) {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    alert("Please log in.");

    return;
  }

  const { error } =
    await supabaseClient
      .from("task_verifications")
      .update({
        status: "approved",
        reviewed_at: new Date().toISOString(),
        reviewed_by: session.user.id
      })
      .eq("id", id)
      .eq("status", "pending");

  if (error) {

    console.error(error);

    alert(
      "Unable to approve verification."
    );

    return;
  }

  loadVerifications();
}


async function rejectVerification(id) {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    alert("Please log in.");

    return;
  }

  const { error } =
    await supabaseClient
      .from("task_verifications")
      .update({
        status: "rejected",
        reviewed_at: new Date().toISOString(),
        reviewed_by: session.user.id
      })
      .eq("id", id)
      .eq("status", "pending");

  if (error) {

    console.error(error);

    alert(
      "Unable to reject verification."
    );

    return;
  }

  loadVerifications();
}


// Resolves an X username to a user_id + current wallet-lock status by
// querying public.profiles directly (RLS on profiles already lets any
// authenticated user read x_username elsewhere in the app, e.g. the
// leaderboard/referral views — this reuses that same read access, not
// a new privilege). Populates the user-id field so the existing
// unlock flow below works unchanged.
let lookedUpUser = null;

async function lookupUser() {

  const matchEl =
    document.getElementById("lookup-match");

  const unlockBtn =
    document.getElementById("unlock-button");

  matchEl.className = "";
  matchEl.textContent = "";
  document.getElementById("unlock-user-id").value = "";
  lookedUpUser = null;

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    alert("Please log in.");

    return;
  }

  const rawInput =
    document.getElementById("unlock-username").value.trim();

  const username =
    rawInput.replace(/^@/, "");

  if (!username) {

    matchEl.className = "lookup-match not-found";
    matchEl.textContent = "Enter a username first.";

    return;
  }

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("id, x_username, locked_wallet_address, wallet_locked_at")
      .ilike("x_username", username)
      .maybeSingle();

  if (error) {

    console.error(error);

    matchEl.className = "lookup-match not-found";
    matchEl.textContent = "Lookup failed: " + error.message;

    return;
  }

  if (!data) {

    matchEl.className = "lookup-match not-found";
    matchEl.textContent = "No user found with that username.";

    return;
  }

  lookedUpUser = data;

  document.getElementById("unlock-user-id").value = data.id;

  matchEl.className = "lookup-match";

  matchEl.innerHTML =
    "Found <strong>@" + escapeHtml(data.x_username) + "</strong><br>" +
    "User ID: " + escapeHtml(data.id) + "<br>" +
    (data.locked_wallet_address
      ? "Currently locked to wallet: " + escapeHtml(data.locked_wallet_address) +
        (data.wallet_locked_at
          ? " (since " + new Date(data.wallet_locked_at).toLocaleString() + ")"
          : "")
      : "No wallet lock on this account — nothing to unlock.");
}


// Admin-only: clears a user's permanently locked wallet via the
// admin_unlock_wallet RPC. The RPC itself re-checks is_admin() and
// records an audit row (public.wallet_lock_audit), so this button is
// a convenience — it grants no access beyond what the RPC already
// enforces server-side.
async function unlockWallet() {

  const resultEl =
    document.getElementById("unlock-result");

  resultEl.textContent = "";

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    alert("Please log in.");

    return;
  }

  const userId =
    document.getElementById("unlock-user-id").value.trim();

  if (!userId) {

    resultEl.textContent =
      "Enter a user ID first, or look up a username above.";

    return;
  }

  const label =
    (lookedUpUser && lookedUpUser.id === userId)
      ? "@" + lookedUpUser.x_username + " (" + userId + ")"
      : userId;

  const confirmed = confirm(
    "This will permanently clear the locked wallet for " +
    label +
    " so they can re-verify with a different wallet. Continue?"
  );

  if (!confirmed) return;

  const { data, error } =
    await supabaseClient.rpc("admin_unlock_wallet", {
      p_user_id: userId
    });

  if (error) {

    console.error(error);

    resultEl.textContent =
      "Unlock failed: " + error.message;

    return;
  }

  if (!data.was_locked) {

    resultEl.textContent =
      "That user had no locked wallet — nothing to do.";

    return;
  }

  resultEl.textContent =
    "Unlocked " + label + ". Previously locked wallet: " +
    data.previous_wallet_address;

  // Clear the stale lookup card so a re-check reflects the new state.
  document.getElementById("lookup-match").textContent = "";
  document.getElementById("lookup-match").className = "";
  lookedUpUser = null;
}


function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;
}


loadVerifications();

</script>

</body>
</html>
